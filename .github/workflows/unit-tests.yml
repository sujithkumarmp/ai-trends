name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    # ready_for_review and labeled are not default types. Without them, marking
    # a draft PR ready or applying the auto-merge label fires no run, so the
    # auto-merge job below would stay unreachable until the next push.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          for req in $(find . -name requirements.txt -not -path './.git/*'); do
            echo "installing $req"
            pip install -r "$req"
          done

      - name: Run unit tests
        id: pytest
        run: python -m pytest tests --junitxml=reports/junit.xml -q
        continue-on-error: true

      - name: Generate Markdown and HTML reports
        if: always()
        run: |
          python scripts/test_report.py reports/junit.xml \
            --markdown reports/test-results.md \
            --html reports/test-results.html

      - name: Publish summary
        if: always()
        run: cat reports/test-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            reports/test-results.md
            reports/test-results.html
            reports/junit.xml
          if-no-files-found: error

      - name: Fail if any test failed
        if: steps.pytest.outcome != 'success'
        run: |
          echo "::error::Unit tests failed - see the run summary or the uploaded report."
          exit 1

  auto-merge:
    name: Auto-merge PR on green
    needs: test
    # Opt-in only: a PR merges unattended solely when a human has applied the
    # "auto-merge" label to it. Without the label this job skips and the PR
    # waits for a human to merge it.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest

    steps:
      - name: Squash-merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR is $state - nothing to merge."
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
